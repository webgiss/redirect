<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Redirect generic page</title>
    <script type="text/javascript">
        const pathSegmentsToKeep = 1;

        const {protocol, hostname, port, search, pathname, hash} = window.location;
        const basePath = `${protocol}//${hostname}${port ? ':' + port : ''}`
        const pathParts = pathname.slice(1).split('/')
        const keepPath = pathParts.slice(0, pathSegmentsToKeep).join('/')
        const remainingPath = pathParts.slice(pathSegmentsToKeep).join('/')
        const searchPrefix = (search && search.length > 0 ? `${search}&` : `?` )
        const newUrl = `${basePath}/${keepPath}${searchPrefix}path=${remainingPath}${hash}`
        window.location.replace(newUrl)
    </script>
</head>

<body>
</body>

</html>
